services:
  postgres:
    image: postgres:16-alpine
    container_name: oneatlas-postgres
    restart: always
    environment:
      POSTGRES_USER: oneatlas
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: oneatlas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
